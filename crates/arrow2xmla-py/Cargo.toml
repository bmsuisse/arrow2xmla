[package]
name = "arrow2xmla-py"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
arrow2xmla = { path = "../arrow2xmla" }
arrow = { version = "60", default-features = false, features = ["pyarrow"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"] }
