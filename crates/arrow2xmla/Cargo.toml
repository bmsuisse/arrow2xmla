[package]
name = "arrow2xmla"
description = "Write XMLA (MDDataset) cellsets straight from columnar (Arrow) data, and parse XMLA requests. Pure Rust, no engine or product dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/bmsuisse/arrow2xmla"
readme = "../../README.md"
keywords = ["xmla", "arrow", "olap", "excel", "mdx"]
categories = ["database", "encoding"]

[dependencies]
itoa = "1"
quick-xml = { version = "0.42", optional = true }
zmij = "1.0.23"

[features]
default = ["request"]
# the request parser (`parse_request`), on `quick-xml`
request = ["dep:quick-xml"]
# `Array::try_from(&arrow_array::ArrayRef)`
arrow = ["dep:arrow-array", "dep:arrow-schema"]

[dependencies.arrow-array]
version = "60"
optional = true

[dependencies.arrow-schema]
version = "60"
optional = true
